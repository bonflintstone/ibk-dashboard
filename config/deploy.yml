<% require "rails"; require "dotenv-rails"; Dotenv::Rails.overload %>

# Name of your application. Used to uniquely configure containers.
service: ibk_dashboard

# Name of the container image.
image: bonflintstone/ibk_dashboard

# Deploy to these servers.
servers:
  web:
    - ibk-dashboard.at

proxy:
  ssl: true
  hosts:
    - ibk-dashboard.at
    - www.ibk-dashboard.at

registry:
  username: bonflintstone
  password: <%= ENV["KAMAL_REGISTRY_PASSWORD"] %>

env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - ANTHROPIC_API_KEY
    - ADMIN_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true

volumes:
  - "storage:/rails/storage"

volumes:
  - "ibk_dashboard_2_storage:/rails/storage"

asset_path: /rails/public/assets

aliases:
  rc: app exec --interactive --reuse "bin/rails c"
  bash: app exec --interactive --reuse "bash"
  logs: app logs -f

builder:
  arch: amd64
