<% require "rails"; require "dotenv-rails"; Dotenv::Rails.overwrite = true; Dotenv::Rails.load %>

# Name of your application. Used to uniquely configure containers.
service: ibk_dashboard

# Name of the container image.
image: bonflintstone/ibk_dashboard

# Deploy to these servers.
servers:
  web:
    - ibk-dashboard.at

proxy:
  ssl: true
  hosts:
    - ibk-dashboard.at
    - www.ibk-dashboard.at

registry:
  username: bonflintstone
  password: <%= ENV["KAMAL_REGISTRY_PASSWORD"] %>

env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - ANTHROPIC_API_KEY
    - ADMIN_PASSWORD
    - HCAPTCHA_SITE_KEY
    - HCAPTCHA_SECRET_KEY
    - DECODO_AUTH
    - DECODO_URL
    - SENTRY_DSN
  clear:
    SOLID_QUEUE_IN_PUMA: true

# Self-hosted error tracking. Runs as its own container on the kamal network, so the
# app reaches it directly and kamal-proxy can route a subdomain to it (see README/setup).
accessories:
  bugsink:
    image: bugsink/bugsink:2.2.2
    host: ibk-dashboard.at
    env:
      clear:
        PORT: 8000
        BEHIND_HTTPS_PROXY: true
        BASE_URL: https://bugsink.ibk-dashboard.at
        DATABASE_PATH: /data/db.sqlite3
      secret:
        - SECRET_KEY
        - CREATE_SUPERUSER
    volumes:
      - bugsink_data:/data

volumes:
  - "storage:/rails/storage"

volumes:
  - "ibk_dashboard_2_storage:/rails/storage"

asset_path: /rails/public/assets

aliases:
  rc: app exec --interactive --reuse "bin/rails c"
  bash: app exec --interactive --reuse "bash"
  logs: app logs -f

builder:
  arch: amd64
